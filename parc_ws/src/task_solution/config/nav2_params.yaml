amcl:
  ros__parameters:
    set_initial_pose: true

    initial_pose.x: -0.071
    initial_pose.y: 0.042
    initial_pose.z: 0.0
    initial_pose.yaw: -0.044
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    # Start pose is known, so far fewer particles are needed (CPU for the sim).
    max_particles: 800
    min_particles: 200
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan_filtered

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Robot limits (gz_control.xacro): 0.5 m/s, 1.0 rad/s, 1 m/s^2, 2 rad/s^2
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.3, 0.0, -1.0]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: "/botwheel_explorer/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

amcl_map_client:
  ros__parameters:
    use_sim_time: True

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /botwheel_explorer/odom

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    odom_topic: /botwheel_explorer/odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
      stateful: True
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False   # publishing every trajectory costs CPU
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -2.0
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.2
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      ObstacleFootprint.scale: 0.02
      # BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.21, 0.23], [0.21, -0.23], [-0.30, -0.23], [-0.30, 0.23]]"
      # robot_radius: 0.22
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.59
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.08   # 16 voxels x 0.08 = 1.28 m, above the 1.01 m top camera
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        # Not /scan_merged: camera2 looks 60 deg down, so its flat depth scan reports
        # the floor ~0.65 m ahead as an obstacle. Lidar + 3D depth clouds instead.
        observation_sources: scan camera1_cloud camera2_cloud
        # 3D points from both depth cameras (task_solution/depth_obstacles), already
        # filtered to 0.10-1.25 m high: sees tabletops the lidar passes under.
        camera1_cloud:
          topic: /depth_obstacles/camera1
          data_type: "PointCloud2"
          min_obstacle_height: 0.05
          max_obstacle_height: 1.27
          marking: True
          clearing: True
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
        camera2_cloud:
          topic: /depth_obstacles/camera2
          data_type: "PointCloud2"
          min_obstacle_height: 0.05
          max_obstacle_height: 1.27
          marking: True
          clearing: True
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: True
      footprint: "[[0.21, 0.23], [0.21, -0.23], [-0.30, -0.23], [-0.30, 0.23]]"
      # robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # Lidar only: the depth clouds blocked every global plan to tag 4. They stay in
        # the local costmap and collision_monitor. Was: scan camera1_cloud camera2_cloud
        observation_sources: scan
        # 3D points from both depth cameras (task_solution/depth_obstacles), already
        # filtered to 0.10-1.25 m high: sees tabletops the lidar passes under.
        camera1_cloud:
          topic: /depth_obstacles/camera1
          data_type: "PointCloud2"
          min_obstacle_height: 0.05
          max_obstacle_height: 1.27
          marking: True
          clearing: True
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
        camera2_cloud:
          topic: /depth_obstacles/camera2
          data_type: "PointCloud2"
          min_obstacle_height: 0.05
          max_obstacle_height: 1.27
          marking: True
          clearing: True
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

map_server:
  ros__parameters:
    use_sim_time: True

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5000
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: False

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    # NavFn (x/y only). It only checks the robot centre at the start, so it can plan
    # away from right next to a tag post. Smac Hybrid-A* (planned the final heading)
    # rejected those starts as "Start occupied" and stalled the run. The camera
    # alignment in tag_visitor now does the "arrive facing the tag" part instead.
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true
    # Smac Hybrid-A* settings, kept for reference (replace the block above to use):
    # GridBased:
    #   plugin: "nav2_smac_planner::SmacPlannerHybrid"
    #   motion_model_for_search: "DUBIN"     # forward only: DWB never reverses (min_vel_x 0)
    #   minimum_turning_radius: 0.30         # m; tight enough for the arena gaps
    #   angle_quantization_bins: 72          # 5 deg heading resolution
    #   tolerance: 0.25                      # m, if the exact goal is blocked
    #   allow_unknown: true
    #   downsample_costmap: false
    #   downsampling_factor: 1
    #   max_iterations: 1000000
    #   max_on_approach_iterations: 1000
    #   max_planning_time: 1.5               # s; the laptop is CPU-bound
    #   analytic_expansion_ratio: 3.5
    #   analytic_expansion_max_length: 3.0
    #   analytic_expansion_max_cost: 200.0
    #   analytic_expansion_max_cost_override: false
    #   reverse_penalty: 2.0
    #   change_penalty: 0.0
    #   non_straight_penalty: 1.2
    #   cost_penalty: 2.0                    # stay away from obstacles where there is room
    #   retrospective_penalty: 0.015
    #   lookup_table_size: 20.0
    #   cache_obstacle_heuristic: false
    #   debug_visualizations: false
    #   use_quadratic_cost_penalty: false
    #   downsample_obstacle_heuristic: true
    #   allow_primitive_interpolation: false
    #   smooth_path: true
    #   smoother:
    #     max_iterations: 1000
    #     w_smooth: 0.3
    #     w_data: 0.2
    #     tolerance: 1.0e-10
    #     do_refinement: true
    #     refinement_num: 2

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0

collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"   # the robot drives from /cmd_vel
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 3.0      # camera clouds can lag >1 s when the sim runs slow; 1.0 froze the robot
    base_shift_correction: True
    stop_pub_timeout: 2.0
    enable_stamped_cmd_vel: False
    use_realtime_priority: False
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      # 1.5 s slowed every final approach: the tag post is ~0.3 m ahead of the bumper.
      time_before_collision: 1.0
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan", "camera1_cloud", "camera2_cloud"]
    camera1_cloud:
      type: "pointcloud"
      topic: "/depth_obstacles/camera1"
      min_height: 0.05
      max_height: 1.27
      enabled: True
    camera2_cloud:
      type: "pointcloud"
      topic: "/depth_obstacles/camera2"
      min_height: 0.05
      max_height: 1.27
      enabled: True
    scan:
      type: "scan"
      topic: "/scan_filtered"
      min_height: 0.05
      max_height: 2.0
      enabled: True

lifecycle_manager_navigation:
  ros__parameters:
    autostart: True
    node_names: ['controller_server',
                 'smoother_server',
                 'planner_server',
                 'behavior_server',
                 'bt_navigator',
                 'waypoint_follower',
                 'velocity_smoother',
                 'collision_monitor']

robot_state_publisher:
  ros__parameters:
    use_sim_time: True
